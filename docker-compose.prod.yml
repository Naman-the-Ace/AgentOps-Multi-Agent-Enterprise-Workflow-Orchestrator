name: agentops-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - agentops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M

  mcp_server:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourusername/agentops}/mcp:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      POSTGRES_URL: ${POSTGRES_URL:?required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
      replicas: 1

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourusername/agentops}/api:latest
    env_file:
      - .env.prod
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?required}
      POSTGRES_SYNC_URL: ${POSTGRES_SYNC_URL:?required}
      MCP_SERVER_URL: http://mcp_server:8001/mcp
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_started
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 256M
      replicas: 2

  dashboard:
    image: ghcr.io/${GITHUB_REPOSITORY:-yourusername/agentops}/dashboard:latest
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  agentops_pgdata:
    driver: local
