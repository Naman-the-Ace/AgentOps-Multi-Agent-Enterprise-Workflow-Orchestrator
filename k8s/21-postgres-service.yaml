apiVersion: v1
kind: Service
metadata:
  name: agentops-postgres
  namespace: agentops
  labels:
    app.kubernetes.io/name: agentops
    app.kubernetes.io/component: postgres
spec:
  # Headless service for StatefulSet stable DNS.
  clusterIP: None
  selector:
    app.kubernetes.io/name: agentops
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
